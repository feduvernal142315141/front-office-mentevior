name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  CONTAINER_NAME: front-office-mentevior
  APP_DIR: /opt/front-office-mentevior

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        run: |
          IMAGE_REPOSITORY="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${REGISTRY}/${IMAGE_REPOSITORY}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "latest=${REGISTRY}/${IMAGE_REPOSITORY}:production" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.PROD_NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          ssh-keyscan -p "${{ secrets.PROD_SSH_PORT || 22 }}" "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy container
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_APP_DIR: ${{ secrets.PROD_APP_DIR || env.APP_DIR }}
          PROD_CONTAINER_NAME: ${{ secrets.PROD_CONTAINER_NAME || env.CONTAINER_NAME }}
          PROD_HOST_PORT: ${{ secrets.PROD_HOST_PORT || 3000 }}
          PROD_NEXT_PUBLIC_API_URL: ${{ secrets.PROD_NEXT_PUBLIC_API_URL }}
          PROD_BACKEND_API_URL: ${{ secrets.PROD_BACKEND_API_URL }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
        run: |
          ssh -i ~/.ssh/prod_key -p "${PROD_SSH_PORT}" "${PROD_SSH_USER}@${PROD_SSH_HOST}" \
            IMAGE="${IMAGE}" \
            APP_DIR="${PROD_APP_DIR}" \
            CONTAINER_NAME="${PROD_CONTAINER_NAME}" \
            HOST_PORT="${PROD_HOST_PORT}" \
            NEXT_PUBLIC_API_URL="${PROD_NEXT_PUBLIC_API_URL}" \
            BACKEND_API_URL="${PROD_BACKEND_API_URL}" \
            GHCR_USERNAME="${GHCR_USERNAME}" \
            GHCR_TOKEN="${GHCR_TOKEN}" \
            'bash -se' <<'REMOTE_SCRIPT'
          set -euo pipefail

          mkdir -p "${APP_DIR}"
          cat > "${APP_DIR}/.env" <<EOF
          NODE_ENV=production
          NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
          BACKEND_API_URL=${BACKEND_API_URL}
          EOF

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin
          docker pull "${IMAGE}"

          docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart unless-stopped \
            --env-file "${APP_DIR}/.env" \
            -p "${HOST_PORT}:3000" \
            "${IMAGE}"

          docker image prune -f
          REMOTE_SCRIPT
